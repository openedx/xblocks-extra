dependencies = [
    { name = "django" },
    { name = "django-crum" },
    { name = "edx-codejail" },
    { name = "openedx-filters" },
    { name = "requests" },
    { name = "six" },
    { name = "xblock", extra = ["django"] },
]

[package.optional-dependencies]
dev = [
    { name = "build" },
    { name = "edx-i18n-tools" },
    { name = "ruff" },
]
docs = [
    { name = "sphinx" },
    { name = "sphinx-book-theme" },
]
test = [
    { name = "coverage" },
    { name = "edx-lint" },
    { name = "edx-opaque-keys" },
    { name = "mock" },
    { name = "pytest" },
    { name = "pytest-cov" },
    { name = "pytest-django" },
    { name = "xblock-sdk" },
]

[package.metadata]
requires-dist = [
    { name = "build", marker = "extra == 'dev'" },
    { name = "coverage", marker = "extra == 'test'" },
    { name = "django", specifier = ">=4.2" },
    { name = "django-crum" },
    { name = "edx-codejail" },
    { name = "edx-i18n-tools", marker = "extra == 'dev'" },
    { name = "edx-lint", marker = "extra == 'test'" },
    { name = "edx-opaque-keys", marker = "extra == 'test'" },
    { name = "mock", marker = "extra == 'test'" },
    { name = "openedx-filters" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=7.0" },
    { name = "pytest-cov", marker = "extra == 'test'" },
    { name = "pytest-django", marker = "extra == 'test'" },
    { name = "requests" },
    { name = "ruff", marker = "extra == 'dev'" },
    { name = "six" },
    { name = "sphinx", marker = "extra == 'docs'" },
    { name = "sphinx-book-theme", marker = "extra == 'docs'" },
    { name = "xblock", extras = ["django"] },
    { name = "xblock-sdk", marker = "extra == 'test'" },
]
provides-extras = ["dev", "test", "docs"]
